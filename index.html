<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferienwohnung Seeblick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ferienwohnung Seeblick</h1>
    <nav>
      <a href="#wohnung">Wohnung</a>
      <a href="#preise">Preise</a>
      <a href="#kontakt">Kontakt</a>
    </nav>
  </header>

  <main>
    <section id="wohnung">
      <h2>Die Wohnung</h2>
      <p>Gemütliche 3-Zimmer-Wohnung mit Blick auf den See, Platz für 4 Personen.</p>
    </section>

    <section id="preise">
      <h2>Preise</h2>
      <p>Ab CHF 120.– pro Nacht, Mindestaufenthalt 3 Nächte.</p>
    </section>

    <section id="kontakt">
      <h2>Kontakt</h2>
      <p>Interesse? Senden Sie uns eine Anfrage.</p>
      <button id="anfrage-button">Anfrage senden</button>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="jahr"></span> Ferienwohnung Seeblick</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
