<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <!-- Eigene Illustration: Schlafzimmer -->
  <defs>
    <linearGradient id="aussen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3dad6"/>
      <stop offset="1" stop-color="#eef1ec"/>
    </linearGradient>
  </defs>

  <!-- Wand und Boden -->
  <rect width="1200" height="590" fill="#e8f0ee"/>
  <rect y="590" width="1200" height="210" fill="#cbb59d"/>
  <g stroke="#b8a28a" stroke-width="2">
    <line x1="0" y1="650" x2="1200" y2="650"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
  </g>

  <!-- Fenster links -->
  <rect x="50" y="120" width="160" height="320" fill="url(#aussen)"/>
  <path d="M50 330 L100 270 L140 310 L210 240 L210 360 L50 360 Z" fill="#a3bfba"/>
  <rect x="50" y="360" width="160" height="80" fill="#3f7f7a"/>
  <g fill="none" stroke="#ffffff" stroke-width="10">
    <rect x="50" y="120" width="160" height="320"/>
    <line x1="130" y1="120" x2="130" y2="440"/>
  </g>
  <rect x="210" y="100" width="40" height="380" fill="#9fbdb5"/>

  <!-- Bild über dem Bett -->
  <rect x="500" y="110" width="200" height="130" fill="#fbfaf7" stroke="#7b5a43" stroke-width="8"/>
  <path d="M516 224 L570 160 L610 200 L640 175 L684 224 Z" fill="#6c918c"/>
  <path d="M570 160 L558 176 L570 172 L582 176 Z" fill="#ffffff"/>

  <!-- Teppich -->
  <ellipse cx="600" cy="700" rx="400" ry="60" fill="#e6dfd2"/>

  <!-- Bett -->
  <rect x="360" y="290" width="480" height="230" rx="16" fill="#8a6a52"/>
  <rect x="330" y="470" width="540" height="160" rx="10" fill="#ffffff" stroke="#d6e2df" stroke-width="3"/>
  <rect x="330" y="560" width="540" height="70" fill="#9fbdb5"/>
  <rect x="330" y="630" width="540" height="20" fill="#7b5a43"/>
  <!-- Kissen -->
  <rect x="390" y="410" width="190" height="72" rx="30" fill="#fbfaf7" stroke="#d6e2df" stroke-width="3"/>
  <rect x="620" y="410" width="190" height="72" rx="30" fill="#fbfaf7" stroke="#d6e2df" stroke-width="3"/>

  <!-- Nachttische -->
  <rect x="210" y="500" width="100" height="120" fill="#7b5a43"/>
  <rect x="890" y="500" width="100" height="120" fill="#7b5a43"/>
  <g stroke="#5e4433" stroke-width="3">
    <line x1="210" y1="560" x2="310" y2="560"/>
    <line x1="890" y1="560" x2="990" y2="560"/>
  </g>

  <!-- Lampen -->
  <rect x="254" y="440" width="12" height="60" fill="#0f3d3e"/>
  <path d="M224 440 L296 440 L282 392 L238 392 Z" fill="#fbfaf7" stroke="#d6cfc2" stroke-width="2"/>
  <rect x="934" y="440" width="12" height="60" fill="#0f3d3e"/>
  <path d="M904 440 L976 440 L962 392 L918 392 Z" fill="#fbfaf7" stroke="#d6cfc2" stroke-width="2"/>

  <!-- Buch auf dem Nachttisch -->
  <rect x="910" y="486" width="50" height="14" fill="#2e8b7a"/>
</svg>
